name: Build

on:
  workflow_dispatch:

jobs:
  build-tapi:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      cache-key: ${{ steps.set-key.outputs.key }}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup TAPI Cache
      id: cache-tapi
      uses: actions/cache@v4
      with:
        path: D:\a\_temp\msys64\mingw64
        key: msys2-tapi-v3-${{ runner.os }}

    - name: Setup MSYS2
      if: steps.cache-tapi.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git mingw-w64-x86_64-cmake mingw-w64-x86_64-clang mingw-w64-x86_64-ninja

    - name: Build apple-libtapi
      if: steps.cache-tapi.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/tpoechtrager/apple-libtapi -b 1600.0.11.8
        cd apple-libtapi
        sed -i 's/FileRenameInfoEx/FileRenameInfo/g' src/llvm/lib/Support/Windows/Path.inc
        sed -i 's/FILE_RENAME_INFO_EX/FILE_RENAME_INFO/g' src/llvm/lib/Support/Windows/Path.inc
        sed -i 's/#if defined(HAVE_UNISTD_H)/#if defined(HAVE_UNISTD_H) \&\& !defined(_WIN32)/g' src/llvm/lib/CAS/CachingOnDiskFileSystem.cpp
        sed -i '1i #include <cstdint>' src/llvm/lib/Target/AMDGPU/MCTargetDesc/AMDGPUMCTargetDesc.h || true
        
        mkdir build && cd build
        cmake -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
          -DCMAKE_C_COMPILER=/mingw64/bin/clang.exe \
          -DCMAKE_CXX_COMPILER=/mingw64/bin/clang++.exe \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          ../src/llvm
        ninja
        cmake --install .

  build-dispatch:
    runs-on: windows-latest
    needs: build-tapi
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Load TAPI Environment
      uses: actions/cache@v4
      with:
        path: D:\a\_temp\msys64\mingw64
        key: msys2-tapi-v3-${{ runner.os }}

    - name: Setup Dispatch Cache
      id: cache-dispatch
      uses: actions/cache@v4
      with:
        path: D:\a\_temp\msys64\mingw64
        key: msys2-dispatch-v3-${{ runner.os }}

    - name: Setup MSYS2
      if: steps.cache-dispatch.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git mingw-w64-x86_64-cmake mingw-w64-x86_64-clang mingw-w64-x86_64-ninja

    - name: Build apple-libdispatch
      if: steps.cache-dispatch.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 https://github.com/tpoechtrager/apple-libdispatch/
        cd apple-libdispatch
        
        sed -i 's/void _dispatch_bug_deprecated(const char\* msg);/#define _dispatch_bug_deprecated(msg) do {} while(0)/g' src/internal.h
        
        mkdir build && cd build
        cmake -G "Ninja" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=/mingw64/bin/clang.exe \
          -DCMAKE_CXX_COMPILER=/mingw64/bin/clang++.exe \
          -DCMAKE_INSTALL_PREFIX=/mingw64 \
          ..
        ninja
        cmake --install .

  build-ld64:
    runs-on: windows-latest
    needs: build-dispatch
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Load Prebuilt Environment
      uses: actions/cache@v4
      with:
        path: D:\a\_temp\msys64\mingw64
        key: msys2-dispatch-v3-${{ runner.os }}

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git make autoconf automake libtool pkg-config mingw-w64-x86_64-gcc

    - name: Build cctools-port (ld64)
      run: |
        cd cctools
        ./autogen.sh
        ./configure \
          --program-prefix=arm-apple-darwin11- \
          --enable-tapi-support \
          --with-libtapi=/mingw64 \
          --with-libdispatch=/mingw64 \
          --with-libblocksruntime=/mingw64
        
        mingw32-make -j$(nproc)
        
        mkdir -p ${{ github.workspace }}/output_dist
        cp -v ld64/src/ld/ld.exe ${{ github.workspace }}/output_dist/arm-apple-darwin11-ld64.exe
        cp -v /mingw64/bin/libtapi.dll ${{ github.workspace }}/output_dist/ || true
        cp -v /mingw64/bin/libwinpthread-1.dll ${{ github.workspace }}/output_dist/ || true
        cp -v /mingw64/bin/libstdc++-6.dll ${{ github.workspace }}/output_dist/ || true
        cp -v /mingw64/bin/libgcc_s_seh-1.dll ${{ github.workspace }}/output_dist/ || true

    - name: Upload Finished Toolchain
      uses: actions/upload-artifact@v4
      with:
        name: ios-toolchain-windows-ld64
        path: ${{ github.workspace }}/output_dist/
